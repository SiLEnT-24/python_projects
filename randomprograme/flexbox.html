<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Flexbox</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <!-- Top Row -->
        <div class="top-row">
            <div class="red top-large"></div>
            <div class="yellow top-small"></div>
            <div class="cyan top-medium"></div>
        </div>

        <!-- Middle Section -->
        <div class="main">

            <!-- Left Column -->
            <div class="left">
                <div class="green"></div>
                <div class="pink"></div>
            </div>

            <!-- Center -->
            <div class="blue"></div>

            <!-- Right Section -->
            <div class="right">

                <div class="right-top">
                    <div class="right-column">
                        <div class="cyan small"></div>
                        <div class="orange small"></div>
                    </div>

                    <div class="right-column">
                        <div class="yellow small"></div>
                        <div class="light-green small"></div>
                    </div>
                </div>

                <div class="red bottom"></div>

            </div>

        </div>

        <h1>CSS FLEXBOX</h1>

    </div>

</body>
</html>
